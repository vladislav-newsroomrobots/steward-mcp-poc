<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Steward</title>
        <style>
            :root {
                color-scheme: light dark;
                --bg: #ffffff;
                --fg: #16181d;
                --muted: #5f6673;
                --border: #dfe3ea;
                --field: #ffffff;
                --accent: #2f5bea;
                --accent-fg: #ffffff;
                --ok-bg: #e8f5ec;
                --ok-fg: #1c6b3a;
                --warn-bg: #fdf3e3;
                --warn-fg: #8a5a12;
                --err-bg: #fdeaea;
                --err-fg: #97231f;
                --code-bg: #f4f6f9;
            }

            @media (prefers-color-scheme: dark) {
                :root {
                    --bg: #1c1f26;
                    --fg: #eceef2;
                    --muted: #a0a7b4;
                    --border: #333845;
                    --field: #242833;
                    --accent: #6b8dff;
                    --accent-fg: #12141a;
                    --ok-bg: #16301f;
                    --ok-fg: #7fd6a0;
                    --warn-bg: #33280f;
                    --warn-fg: #e8c07a;
                    --err-bg: #3a1d1c;
                    --err-fg: #ff9d97;
                    --code-bg: #242833;
                }
            }

            * {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                padding: 16px;
                background: var(--bg);
                color: var(--fg);
                font: 14px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif;
            }

            .card {
                border: 1px solid var(--border);
                border-radius: 10px;
                padding: 16px;
                max-width: 560px;
            }

            header {
                display: flex;
                align-items: center;
                gap: 10px;
                flex-wrap: wrap;
                margin-bottom: 12px;
            }

            h1 {
                margin: 0;
                font-size: 18px;
                flex: 1;
            }

            .badge {
                padding: 3px 10px;
                border-radius: 999px;
                font-size: 12px;
                font-weight: 600;
                background: var(--code-bg);
                color: var(--muted);
            }

            .badge[data-state='connected'] {
                background: var(--ok-bg);
                color: var(--ok-fg);
            }

            .badge[data-state='briefed'] {
                background: var(--warn-bg);
                color: var(--warn-fg);
            }

            .badge[data-state='error'] {
                background: var(--err-bg);
                color: var(--err-fg);
            }

            fieldset {
                border: 0;
                margin: 0;
                padding: 0;
            }

            fieldset:disabled {
                opacity: 0.6;
            }

            label {
                display: block;
                margin-bottom: 10px;
                font-size: 12px;
                font-weight: 600;
                color: var(--muted);
            }

            input,
            textarea,
            select {
                display: block;
                width: 100%;
                margin-top: 4px;
                padding: 7px 9px;
                border: 1px solid var(--border);
                border-radius: 7px;
                background: var(--field);
                color: var(--fg);
                font: inherit;
                font-weight: 400;
            }

            textarea {
                min-height: 64px;
                resize: vertical;
            }

            .row {
                display: flex;
                gap: 12px;
            }

            /* The document type's writing tips — the detail the extension
               buried in a settings panel, surfaced here where it is useful. */
            .tips {
                margin: -4px 0 12px;
                padding: 10px 12px 10px 26px;
                border-radius: 8px;
                background: var(--code-bg);
                font-size: 12.5px;
                line-height: 1.45;
                color: var(--muted);
                display: flex;
                flex-direction: column;
                gap: 5px;
            }

            .tips:empty {
                display: none;
            }

            .row > * {
                flex: 1;
            }

            .actions {
                display: flex;
                align-items: center;
                gap: 8px;
                margin-top: 4px;
            }

            button {
                appearance: none;
                border: 0;
                border-radius: 8px;
                padding: 8px 14px;
                font: inherit;
                font-weight: 600;
                color: var(--accent-fg);
                background: var(--accent);
                cursor: pointer;
            }

            button.secondary {
                background: var(--code-bg);
                color: var(--muted);
            }

            button:disabled {
                opacity: 0.5;
                cursor: default;
            }

            hr {
                border: 0;
                border-top: 1px solid var(--border);
                margin: 16px 0;
            }

            .meta {
                margin-top: 8px;
                font-size: 12px;
                color: var(--muted);
            }
        </style>
    </head>
    <body>
        <div class="card">
            <header>
                <h1>Steward</h1>
                <span class="badge" id="status" data-state="connecting">Connecting…</span>
            </header>

            <!-- Inputs are never gated on the host handshake: a broken script
                 must not look like dead HTML. Only the actions are. -->
            <fieldset id="form">
                <label
                    >Document type
                    <select id="documentType"></select>
                </label>

                <ul class="tips" id="tips"></ul>

                <div class="row">
                    <label
                        >Funder
                        <select id="funder"></select>
                    </label>
                    <label
                        >Opportunity
                        <select id="deal"></select>
                    </label>
                </div>

                <label
                    >Request
                    <textarea id="userRequest" placeholder="Thank her for the first gift and mention the county-government desk."></textarea>
                </label>

                <div class="row">
                    <label
                        >Word limit
                        <input id="wordLimit" type="number" min="50" max="2000" step="50" value="300" />
                    </label>
                    <label
                        >Orchestration
                        <select id="variant">
                            <option value="conversation">B — conversation continuation</option>
                            <option value="ui-tool-call">A — UI tool call</option>
                        </select>
                    </label>
                </div>

                <div class="actions">
                    <button id="generate" type="button" disabled>Generate</button>
                    <button id="reset" class="secondary" type="button" disabled>New session</button>
                    <button id="ping" class="secondary" type="button" disabled>Ping</button>
                </div>
            </fieldset>

            <hr />

            <p class="meta">The draft is written in the chat, not here.</p>
            <div class="meta" id="meta"></div>
        </div>
        <!--APP_SCRIPT-->
    </body>
</html>
