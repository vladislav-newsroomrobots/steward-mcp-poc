<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Steward</title>
        <style>
            :root {
                color-scheme: light dark;
                --bg: #ffffff;
                --fg: #16181d;
                --muted: #5f6673;
                --border: #dfe3ea;
                --accent: #2f5bea;
                --accent-fg: #ffffff;
                --ok-bg: #e8f5ec;
                --ok-fg: #1c6b3a;
                --err-bg: #fdeaea;
                --err-fg: #97231f;
                --code-bg: #f4f6f9;
            }

            @media (prefers-color-scheme: dark) {
                :root {
                    --bg: #1c1f26;
                    --fg: #eceef2;
                    --muted: #a0a7b4;
                    --border: #333845;
                    --accent: #6b8dff;
                    --accent-fg: #12141a;
                    --ok-bg: #16301f;
                    --ok-fg: #7fd6a0;
                    --err-bg: #3a1d1c;
                    --err-fg: #ff9d97;
                    --code-bg: #242833;
                }
            }

            * {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                padding: 16px;
                background: var(--bg);
                color: var(--fg);
                font: 14px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif;
            }

            .card {
                border: 1px solid var(--border);
                border-radius: 10px;
                padding: 16px;
                max-width: 480px;
            }

            h1 {
                margin: 0 0 4px;
                font-size: 18px;
            }

            .status {
                display: inline-block;
                margin: 8px 0 12px;
                padding: 3px 10px;
                border-radius: 999px;
                font-size: 12px;
                font-weight: 600;
                background: var(--code-bg);
                color: var(--muted);
            }

            .status[data-state='ready'] {
                background: var(--ok-bg);
                color: var(--ok-fg);
            }

            .status[data-state='error'] {
                background: var(--err-bg);
                color: var(--err-fg);
            }

            dl {
                margin: 0 0 12px;
                display: grid;
                grid-template-columns: auto 1fr;
                gap: 2px 12px;
                font-size: 13px;
            }

            dt {
                color: var(--muted);
            }

            dd {
                margin: 0;
            }

            button {
                appearance: none;
                border: 0;
                border-radius: 8px;
                padding: 8px 14px;
                font: inherit;
                font-weight: 600;
                color: var(--accent-fg);
                background: var(--accent);
                cursor: pointer;
            }

            button:disabled {
                opacity: 0.5;
                cursor: default;
            }

            pre {
                margin: 12px 0 0;
                padding: 10px;
                border-radius: 8px;
                background: var(--code-bg);
                font-size: 12px;
                white-space: pre-wrap;
                word-break: break-word;
            }

            pre:empty {
                display: none;
            }
        </style>
    </head>
    <body>
        <div class="card">
            <h1>Steward</h1>
            <span class="status" id="status" data-state="connecting">Connecting…</span>
            <dl id="host-info"></dl>
            <button id="ping" type="button" disabled>Ping server</button>
            <pre id="output"></pre>
        </div>
        <!--APP_SCRIPT-->
    </body>
</html>
