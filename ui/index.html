<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Steward</title>
        <!--APP_STYLES-->
    </head>
    <body>
        <div class="card">
            <header>
                <h1>Steward</h1>
                <span class="badge" id="status" data-state="connecting">Connecting…</span>
            </header>

            <!-- Inputs are never gated on the host handshake: a broken script
                 must not look like dead HTML. Only the actions are. -->
            <fieldset id="form">
                <label
                    >Document type
                    <select id="documentType"></select>
                </label>

                <ul class="tips" id="tips"></ul>

                <label
                    >Funders
                    <select id="funderPicker"></select>
                </label>
                <ul class="chips" id="funderChips"></ul>

                <label
                    >Opportunities
                    <select id="dealPicker"></select>
                </label>
                <ul class="chips" id="dealChips"></ul>

                <label
                    >Request
                    <textarea id="userRequest" placeholder="Thank her for the first gift and mention the county-government desk."></textarea>
                </label>

                <label
                    >Word limit
                    <input id="wordLimit" type="number" min="50" max="2000" step="50" value="300" />
                </label>

                <div class="actions">
                    <button id="generate" type="button" disabled>Generate</button>
                    <button id="reset" class="secondary" type="button" disabled>New session</button>
                </div>
            </fieldset>

            <hr />

            <div class="meta" id="meta"></div>
        </div>
        <!--APP_SCRIPT-->
    </body>
</html>
